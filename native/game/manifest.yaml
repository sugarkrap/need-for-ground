# Which functions to import from decompiled/ and run natively.
#
# This file is a list of addresses, names and signatures - facts about the
# binary, of the same kind NOTES.md already records. The *code* at those
# addresses is a derivative of the copyrighted game binary and is never
# committed; see .gitignore, which excludes both decompiled/ and
# native/game/generated/.
#
# native/tools/import_decompiled.py turns this file plus your local decompiled/
# output into:
#
#   generated/<symbol>.c       the function, normalised so it compiles
#   generated/game_functions.h declarations of the ported functions
#   generated/game_originals.h address constants and function-pointer typedefs
#                              for calling the ORIGINAL machine code, derived
#                              from each function's recovered signature
#
# That last one is why the signatures do not need repeating in the tests: adding
# an entry here is enough to be able to call both versions and compare them.

functions:
  - address: 0x75c440
    symbol: _strncpy
    kind: crt
    note: MSVC's word-at-a-time strncpy (0x7efefeff zero-byte trick)

  - address: 0x75d260
    symbol: _strrchr
    kind: crt
    note: reverse character search

  - address: 0x401000
    symbol: FUN_00401000
    kind: game
    note: dword-then-byte memcpy, inlined all over the engine

  - address: 0x43ce40
    symbol: FUN_0043ce40
    kind: game
    note: 3D euclidean distance between two float[3]

  - address: 0x48b710
    symbol: FUN_0048b710
    kind: game
    note: dot product into a float[4], preserving y/z/w

  - address: 0x43d1c0
    symbol: FUN_0043d1c0
    kind: game
    note: per-axis proximity test - true when two float[3] agree within a tolerance

  # These two call Win32 *imports*, which makes them the interesting case: the
  # ported copy calls our shim directly, and the original - once the loader has
  # resolved the IAT - calls the same shim through its import table. Running both
  # is what proves hybrid execution works.
  - address: 0x6f5ac8
    symbol: FUN_006f5ac8
    kind: game
    note: reads QueryPerformanceCounter and returns the counter as a 64-bit value

  - address: 0x6fea95
    symbol: FUN_006fea95
    kind: game
    note: __fastcall - initialises a timer struct from timeGetTime

  # The TEB case: an inline-SEH function, which is what most of the C++ in this
  # binary looks like. It saves fs:[0], links a record of its own - handler
  # 0x770fc8 - runs, restores it, and returns. Without a real TEB it reads and
  # writes through whatever %fs happens to hold; with one, both the original and
  # the ported copy walk the same chain. It also makes a __thiscall virtual call,
  # which the test supplies, so the SEH record can be inspected from *inside* the
  # original's frame rather than inferred after the fact.
  - address: 0x40a1f0
    symbol: FUN_0040a1f0
    kind: game
    note: __fastcall destructor with a __try - saves, links and restores fs:[0]

  # The first function from the renderer scope in ../../DIRECTX_SCOPE.md - a
  # SetRenderState caller, which is what most of those 99 functions are. It is
  # made of exactly the two things that scope needs to work: game globals bound to
  # their addresses in the mapped image, and a D3D9 vtable call through a global
  # device pointer.
  #
  # 0x870974 is that device pointer. The instructions only say "four bytes", which
  # is true and useless, so its type is given here - the one thing the machine code
  # cannot express. Everything else is recovered from the code that touches it.
  - address: 0x5b7a30
    symbol: FUN_005b7a30
    kind: renderer
    note: copies two matrix columns into globals, then SetRenderState(ZWRITEENABLE, 0)
    globals:
      0x870974: IDirect3DDevice9 *

# Tried, and deliberately excluded. Each fails for a different reason, and
# together they are a fair summary of what "the decompiler output is not
# compilable C" means in practice. The importer prints these so they stay
# visible rather than becoming folklore.
excluded:
  - address: 0x5bc7b0
    symbol: FUN_005bc7b0
    reason: >-
      The decompilation is wrong, and finding out why is the most useful thing
      this manifest has produced. It was added as a second renderer function -
      two SetRenderState calls on one branch - and the differential test failed
      on the second call: the ported copy passed param_1 where the original
      passed param_2. The machine code is unambiguous
      (`push [esp+8]` before the second call, after the first stdcall callee
      popped its 12 bytes). The cause is upstream, in
      analysis/define_directx_types.py: it declared each vtable slot __stdcall
      but with no parameters, so the decompiler could not know how many bytes a
      vtable call pops and computed every later stack-argument read from the
      wrong esp. That is now fixed by deriving the counts from the SDK header
      (analysis/derive_vtable_args.py), but the decompiled output in this tree
      predates it. Re-run the type definer and re-export this function, and it
      should come back correct - and every other function in
      ../../DIRECTX_SCOPE.md that reads an argument after a vtable call is
      suspect until then.
  - address: 0x75d950
    symbol: __SEH_prolog
    reason: >-
      Not a function, and this one cost a debugging session. Ghidra decompiles it
      as `ExceptionList = auStack_c; return;`, which reads like the ideal TEB
      test case. The machine code is MSVC's __SEH_prolog: it pushes an
      EXCEPTION_REGISTRATION record, links it into fs:[0], moves the caller's
      return address to the top of the stack and `ret`s to it - so it returns
      having permanently consumed 12 bytes of the caller's stack and overwritten
      the caller's saved EBP slot with a new frame pointer. Its contract is "be
      called from a function prologue, and be undone by __SEH_epilog", not "be
      called from C". Calling it from the test smashed the caller's frame; the
      damage surfaced two functions later as unresolvable addresses and a stack
      canary abort at exit. There is nothing to port: the compiler emits this
      role itself. FUN_0040a1f0 above is the honest version of the same test.
  - address: 0x75c800
    symbol: shortsort
    reason: >-
      Ghidra recovered the signature wrongly. The body reads an
      `undefined1 *in_EAX` that is never assigned, so the real function takes a
      parameter Ghidra did not find and the ported code would index off an
      uninitialised register. Needs the signature corrected in Ghidra and
      re-exported.

  - address: 0x75d928
    symbol: __ftol
    reason: >-
      Takes its argument on the x87 register stack (`float10 in_ST0;` in the
      output), which is MSVC's private convention for this helper and has no C
      spelling at all. Needs a hand-written asm thunk, or replacing with the
      compiler's own float-to-int conversion.

  - address: 0x75d860
    symbol: __isnan
    reason: >-
      Uses Ghidra's field-slice syntax on a scalar - `_X._6_2_` for bytes 6..7
      of a double. Not C. Needs the double re-typed as a union in Ghidra, or the
      slices rewritten by hand as shifts.
